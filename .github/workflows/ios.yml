name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCHEME: WearBloom
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_IOS }}
  SENTRY_DSN_IOS: ${{ vars.SENTRY_DSN_IOS }}
  POSTHOG_PROJECT_API_KEY: ${{ vars.POSTHOG_PROJECT_API_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}

jobs:
  server:
    name: Validate server and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check and test
        run: bun run format:check && bun run lint && bun run typecheck && bun test
      - name: Verify generated OpenAPI contract
        run: |
          bun run openapi
          git diff --exit-code ../openapi/wearbloom-v1.json
          cmp ../openapi/wearbloom-v1.json ../WearBloomContract/Sources/WearBloomContract/openapi.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/axensrennes/wearbloom:server-${{ github.sha }}
          cache-from: type=gha,scope=wearbloom-server
          cache-to: type=gha,mode=max,scope=wearbloom-server

      - name: Build and publish immutable web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/axensrennes/wearbloom:web-${{ github.sha }}
          cache-from: type=gha,scope=wearbloom-web
          cache-to: type=gha,mode=max,scope=wearbloom-web

  build:
    name: Test native iOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Xcode container
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find . -maxdepth 3 -name '*.xcworkspace' -not -path '*/xcuserdata/*' -print -quit)"
          project="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"

          if [[ -n "$workspace" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=${workspace#./}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$project" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=${project#./}" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Native project bootstrap pending
        if: steps.xcode.outputs.available != 'true'
        run: echo "No Xcode project exists yet; the repository is ready for the native iOS bootstrap."

      - name: Test on iOS Simulator
        if: steps.xcode.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          args=()
          if [[ "${{ steps.xcode.outputs.kind }}" == "workspace" ]]; then
            args+=("-workspace" "${{ steps.xcode.outputs.path }}")
          else
            args+=("-project" "${{ steps.xcode.outputs.path }}")
          fi

          xcodebuild \
            "${args[@]}" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            test
