server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /.well-known/apple-app-site-association { default_type application/json; try_files /apple-app-site-association =404; }
    location = /apple-app-site-association { default_type application/json; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }
    location = /support { try_files /support.html =404; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
}
