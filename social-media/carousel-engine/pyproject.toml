[project]
name = "wearbloom-carousel-engine"
version = "0.1.0"
description = "Adaptive photo carousel renderer for WearBloom"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "openai>=2.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3"
]

[project.scripts]
wearbloom-carousel = "carousel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carousel"]
