name: wearbloom

x-wearbloom-environment: &wearbloom-environment
  NODE_ENV: production
  DATABASE_URL: postgres://wearbloom:${POSTGRES_PASSWORD:?required}@wearbloom-postgres:5432/wearbloom
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.wearbloom.app}
  STORAGE_ROOT: /app/data/private
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://wearbloom.app}
  AI_PROVIDER: ${AI_PROVIDER:-stub}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1}
  IMAGE_SIZE: ${IMAGE_SIZE:-1024x1536}
  PROMPT_VERSION: ${PROMPT_VERSION:-wearbloom-v1}
  IMAGE_COST_MICROS: ${IMAGE_COST_MICROS:-0}
  MAX_ASSETS_PER_OWNER: ${MAX_ASSETS_PER_OWNER:-500}
  FREE_RENDER_ALLOWANCE: ${FREE_RENDER_ALLOWANCE:-2}
  PAID_MONTHLY_ALLOWANCE: ${PAID_MONTHLY_ALLOWANCE:-20}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64:-}
  APPLE_APP_BUNDLE_IDENTIFIER: ${APPLE_APP_BUNDLE_IDENTIFIER:-com.axel.wearbloom}
  APPLE_APP_ID: ${APPLE_APP_ID:-}
  APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
  APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
  APPLE_IAP_PRIVATE_KEY_BASE64: ${APPLE_IAP_PRIVATE_KEY_BASE64:-}
  APNS_KEY_ID: ${APNS_KEY_ID:-}
  APNS_PRIVATE_KEY_BASE64: ${APNS_PRIVATE_KEY_BASE64:-}
  APNS_TOPIC: ${APNS_TOPIC:-com.axel.wearbloom}
  APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
  POSTHOG_PROJECT_API_KEY: ${POSTHOG_PROJECT_API_KEY:-}
  POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
  SENTRY_DSN_SERVER: ${SENTRY_DSN_SERVER:-}
  APP_ATTEST_REQUIRED: ${APP_ATTEST_REQUIRED:-true}
  APP_ATTEST_ALLOW_DEVELOPMENT: ${APP_ATTEST_ALLOW_DEVELOPMENT:-false}

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wearbloom
      POSTGRES_USER: wearbloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks:
      private:
        aliases: [wearbloom-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearbloom -d wearbloom"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${WEARBLOOM_IMAGE:?pin the promoted image tag or digest}
    entrypoint: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://wearbloom:${POSTGRES_PASSWORD}@wearbloom-postgres:5432/wearbloom
    networks: [private]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ${WEARBLOOM_IMAGE:?pin the promoted image tag or digest}
    restart: unless-stopped
    environment:
      <<: *wearbloom-environment
      ROLE: api
    volumes: [private-images:/app/data/private]
    networks: [private, dokploy-network]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health');const j=await r.json();if(!r.ok||j.status!=='ok'||j.api!==true||j.worker!==true)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.wearbloom-api.rule=Host(`api.wearbloom.app`)
      - traefik.http.routers.wearbloom-api.entrypoints=websecure
      - traefik.http.routers.wearbloom-api.tls.certresolver=letsencrypt
      - traefik.http.services.wearbloom-api.loadbalancer.server.port=3000

  worker:
    image: ${WEARBLOOM_IMAGE:?pin the promoted image tag or digest}
    entrypoint: ["bun", "src/worker.ts"]
    restart: unless-stopped
    environment:
      <<: *wearbloom-environment
      ROLE: worker
    volumes: [private-images:/app/data/private]
    networks: [private]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: ${WEARBLOOM_WEB_IMAGE:?pin the promoted web image tag or digest}
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.wearbloom-web.rule=Host(`wearbloom.app`) || Host(`www.wearbloom.app`)
      - traefik.http.routers.wearbloom-web.entrypoints=websecure
      - traefik.http.routers.wearbloom-web.tls.certresolver=letsencrypt
      - traefik.http.routers.wearbloom-web.middlewares=wearbloom-www-redirect
      - traefik.http.middlewares.wearbloom-www-redirect.redirectregex.regex=^https?://www\.wearbloom\.app/(.*)
      - traefik.http.middlewares.wearbloom-www-redirect.redirectregex.replacement=https://wearbloom.app/$${1}
      - traefik.http.middlewares.wearbloom-www-redirect.redirectregex.permanent=true
      - traefik.http.services.wearbloom-web.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5

  database-backup:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["while true; do pg_dump -h wearbloom-postgres -U wearbloom -d wearbloom -Fc -f /backups/wearbloom-$$(date -u +%Y%m%dT%H%M%SZ).dump; find /backups -type f -mtime +7 -delete; sleep 86400; done"]
    volumes: [database-backups:/backups]
    networks: [private]
    depends_on:
      postgres: { condition: service_healthy }

  offsite-backup:
    image: restic/restic:0.18.0
    profiles: [offsite-backup]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command: ["restic snapshots >/dev/null 2>&1 || restic init; while true; do restic backup /sources; restic forget --keep-within 7d --prune; sleep 86400; done"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - database-backups:/sources/database:ro
      - private-images:/sources/images:ro

networks:
  private: { internal: true }
  dokploy-network: { external: true }

volumes:
  postgres-data:
  private-images:
  database-backups:
